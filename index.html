<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>শুভ জন্মদিন দাদা 🎂</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
}

.container {
  text-align: center;
  color: white;
  padding: 25px;
  z-index: 2;
}

h1 {
  font-size: 45px;
  margin-bottom: 15px;
  text-shadow: 0 4px 10px rgba(0,0,0,.3);
}

.message {
  font-size: 22px;
  line-height: 1.7;
  background: rgba(255,255,255,.2);
  padding: 20px;
  border-radius: 20px;
  backdrop-filter: blur(5px);
}

.cake {
  font-size: 90px;
  animation: bounce 1.5s infinite;
}

.heart {
  color: #ff1744;
}

.balloon {
  position: absolute;
  font-size: 55px;
  animation: float 6s infinite ease-in-out;
}

.b1 { left: 5%; top: 15%; }
.b2 { right: 7%; top: 20%; animation-delay: 1s; }
.b3 { left: 15%; bottom: 10%; animation-delay: 2s; }
.b4 { right: 15%; bottom: 12%; animation-delay: 3s; }

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-35px); }
}

@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.confetti {
  position: absolute;
  font-size: 25px;
  animation: fall 5s linear infinite;
}

@keyframes fall {
  from {
    transform: translateY(-100px) rotate(0deg);
  }
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}
</style>
</head>

<body>

<div class="balloon b1">🎈</div>
<div class="balloon b2">🎈</div>
<div class="balloon b3">🎈</div>
<div class="balloon b4">🎈</div>

<div class="confetti" style="left:10%;animation-delay:0s;">🎊</div>
<div class="confetti" style="left:30%;animation-delay:1s;">✨</div>
<div class="confetti" style="left:50%;animation-delay:2s;">🎉</div>
<div class="confetti" style="left:70%;animation-delay:3s;">✨</div>
<div class="confetti" style="left:90%;animation-delay:1.5s;">🎊</div>

<div class="container">

  <div class="cake">🎂</div>

  <h1>
    🎉 শুভ জন্মদিন দাদা 🎉
    <span class="heart">❤️</span>
  </h1>

  <div class="message">
    তোমার জীবনের প্রতিটি দিন হোক<br>
    নতুন স্বপ্ন, নতুন সাফল্য<br>
    আর আনন্দে ভরা। 🌸<br><br>

    সবসময় ভালো থেকো,<br>
    সুস্থ থেকো, সুখে থেকো। 😊<br><br>

    <b>শুভ জন্মদিন দাদা! ❤️🎂</b>
  </div>

</div>

</body>
</html>
