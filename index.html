<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>শুভ জন্মদিন দাদা 🎂❤️</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
}

body{
background:
radial-gradient(circle at 20% 20%,#5b168a,transparent 30%),
radial-gradient(circle at 80% 25%,#b31268,transparent 30%),
linear-gradient(135deg,#050014,#16002d,#00172f);
color:white;
position:relative;
}

/* Stars */
#stars{
position:fixed;
inset:0;
z-index:1;
}

.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:.2;transform:scale(.7)}
to{opacity:1;transform:scale(1.5)}
}

/* Fireworks canvas */
#fireworks{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:2;
pointer-events:none;
}

/* Main */
.container{
position:relative;
z-index:10;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:18px;
text-align:center;
}

.card{
width:min(94%,560px);
padding:28px 18px;
border-radius:30px;
background:rgba(255,255,255,.10);
border:1px solid rgba(255,255,255,.25);
backdrop-filter:blur(10px);
box-shadow:0 0 40px rgba(255,20,147,.35);
}

/* Heading */
h1{
font-size:clamp(35px,9vw,65px);
text-shadow:
0 0 10px #ff1493,
0 0 25px #ff1493,
0 0 50px #ff1493;
animation:titleGlow 2s infinite alternate;
}

@keyframes titleGlow{
from{transform:scale(1)}
to{transform:scale(1.05)}
}

.subtitle{
font-size:clamp(20px,5vw,32px);
margin-top:10px;
color:#ffd700;
text-shadow:0 0 15px #ffd700;
}

/* Cake */
.cake{
position:relative;
width:190px;
height:155px;
margin:22px auto;
animation:cakeFloat 2s infinite ease-in-out;
}

@keyframes cakeFloat{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}
}

.cake-body{
position:absolute;
bottom:0;
left:10px;
width:170px;
height:85px;
background:linear-gradient(#ff79b0,#ff1493);
border-radius:15px 15px 25px 25px;
box-shadow:0 8px 20px #ff149377;
}

.cream{
position:absolute;
top:0;
left:0;
width:100%;
height:25px;
background:white;
border-radius:50%;
}

.candle{
position:absolute;
top:20px;
width:13px;
height:45px;
background:linear-gradient(45deg,#00eaff,#7c4dff);
border-radius:5px;
z-index:2;
}

.candle:nth-child(1){left:52px}
.candle:nth-child(2){left:88px}
.candle:nth-child(3){left:124px}

.flame{
position:absolute;
width:18px;
height:25px;
top:-25px;
left:-3px;
background:#ffd600;
border-radius:50% 50% 50% 0;
transform:rotate(-45deg);
box-shadow:0 0 10px #ff8c00,0 0 25px #ff4500;
animation:flame .5s infinite alternate;
}

@keyframes flame{
from{transform:rotate(-45deg) scale(.8)}
to{transform:rotate(-45deg) scale(1.15)}
}

/* Message */
.love{
font-size:clamp(21px,5vw,32px);
font-weight:bold;
color:#ffb6c1;
line-height:1.5;
text-shadow:0 0 15px #ff1493;
animation:heart 1.4s infinite;
}

@keyframes heart{
50%{transform:scale(1.06)}
}

/* Music */
.music-btn{
margin-top:18px;
padding:14px 24px;
border:0;
border-radius:50px;
font-size:17px;
font-weight:bold;
color:white;
background:linear-gradient(45deg,#ff1493,#7b2cff);
box-shadow:0 0 25px #ff149377;
cursor:pointer;
}

.music-btn:active{
transform:scale(.94);
}

/* Balloons */
.balloon{
position:fixed;
bottom:-140px;
width:55px;
height:70px;
border-radius:50%;
z-index:5;
animation:balloonUp 8s linear infinite;
}

.balloon:before{
content:"";
position:absolute;
top:68px;
left:50%;
width:2px;
height:100px;
background:rgba(255,255,255,.7);
}

.balloon:after{
content:"";
position:absolute;
bottom:-8px;
left:22px;
border-left:6px solid transparent;
border-right:6px solid transparent;
border-top:10px solid currentColor;
}

@keyframes balloonUp{
from{transform:translateY(0) rotate(-5deg)}
to{transform:translateY(-120vh) rotate(8deg)}
}

/* Confetti */
.confetti{
position:fixed;
top:-20px;
width:9px;
height:16px;
z-index:20;
animation:fall linear forwards;
}

@keyframes fall{
to{transform:translateY(110vh) rotate(720deg)}
}

@media(max-width:500px){
.card{padding:22px 12px}
.cake{transform:scale(.85)}
}
</style>
</head>

<body>

<div id="stars"></div>

<canvas id="fireworks"></canvas>

<div class="container">
<div class="card">

<h1>🎉 শুভ জন্মদিন দাদা 🎉</h1>

<div class="subtitle">
🎂 Happy Birthday Dada 🎂
</div>

<!-- Cake -->
<div class="cake">

<div class="candle">
<div class="flame"></div>
</div>

<div class="candle">
<div class="flame"></div>
</div>

<div class="candle">
<div class="flame"></div>
</div>

<div class="cake-body">
<div class="cream"></div>
</div>

</div>

<div class="love">
❤️ দাদা, তোমাকে অনেক ভালোবাসা ❤️
<br>
তোমার জীবন সুখ, আনন্দ ও সাফল্যে ভরে উঠুক! ✨
</div>

<button class="music-btn" id="musicBtn">
🎵 Birthday Music
</button>

</div>
</div>

<script>

/* ======================
   STARS
====================== */

const stars=document.getElementById("stars");

for(let i=0;i<100;i++){

const star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"%";
star.style.top=Math.random()*100+"%";

star.style.animationDelay=Math.random()*2+"s";

stars.appendChild(star);
}


/* ======================
   BALLOONS
====================== */

const balloonColors=[
"#ff1493",
"#00e5ff",
"#ffd700",
"#7fff00",
"#ff4500",
"#9c27b0",
"#00ff7f"
];

function createBalloon(){

const balloon=document.createElement("div");

balloon.className="balloon";

const color=
balloonColors[
Math.floor(Math.random()*balloonColors.length)
];

balloon.style.background=color;
balloon.style.color=color;

balloon.style.left=
Math.random()*100+"vw";

balloon.style.animationDuration=
(6+Math.random()*6)+"s";

document.body.appendChild(balloon);

setTimeout(()=>{
balloon.remove();
},13000);
}

setInterval(createBalloon,700);


/* ======================
   CONFETTI
====================== */

const confettiColors=[
"#ff1493",
"#00e5ff",
"#ffd700",
"#7fff00",
"#ff4500",
"#9c27b0"
];

function createConfetti(){

const c=document.createElement("div");

c.className="confetti";

c.style.left=
Math.random()*100+"vw";

c.style.background=
confettiColors[
Math.floor(Math.random()*confettiColors.length)
];

c.style.animationDuration=
(3+Math.random()*4)+"s";

document.body.appendChild(c);

setTimeout(()=>{
c.remove();
},8000);
}

setInterval(createConfetti,180);


/* ======================
   FIREWORKS
====================== */

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

let particles=[];

function resize(){

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

}

resize();

window.addEventListener("resize",resize);

function createFirework(){

const x=
Math.random()*canvas.width;

const y=
80+Math.random()*canvas.height*.45;

const colors=[
"#ff1493",
"#00e5ff",
"#ffd700",
"#ff4500",
"#7fff00",
"#9c27b0"
];

const color=
colors[Math.floor(Math.random()*colors.length)];

for(let i=0;i<70;i++){

const angle=
Math.PI*2*i/70;

const speed=
1.5+Math.random()*4;

particles.push({
x:x,
y:y,
vx:Math.cos(angle)*speed,
vy:Math.sin(angle)*speed,
life:80+Math.random()*30,
color:color
});

}

}

function animateFireworks(){

ctx.fillStyle="rgba(5,0,25,.18)";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

particles.forEach((p,index)=>{

p.x+=p.vx;
p.y+=p.vy;

p.vy+=.025;

p.life--;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
2,
0,
Math.PI*2
);

ctx.fillStyle=p.color;

ctx.fill();

if(p.life<=0){

particles.splice(index,1);

}

});

requestAnimationFrame(animateFireworks);

}

animateFireworks();

setInterval(()=>{
createFirework();
setTimeout(createFirework,350);
setTimeout(createFirework,700);
},1800);


/* ======================
   HAPPY BIRTHDAY MUSIC
====================== */

let audioContext=null;
let musicPlaying=false;
let musicTimer=null;

const musicBtn=
document.getElementById("musicBtn");

function playNote(
frequency,
duration,
startTime
){

const oscillator=
audioContext.createOscillator();

const gain=
audioContext.createGain();

oscillator.type="sine";

oscillator.frequency.value=
frequency;

oscillator.connect(gain);

gain.connect(
audioContext.destination
);

gain.gain.setValueAtTime(
0.0001,
startTime
);

gain.gain.exponentialRampToValueAtTime(
0.22,
startTime+.03
);

gain.gain.exponentialRampToValueAtTime(
0.0001,
startTime+duration
);

oscillator.start(startTime);

oscillator.stop(
startTime+duration
);

}


/*
   Happy Birthday tune

   C C D C F E
   C C D C G F
   C C C A F E D
   Bb Bb A F G F
*/

function startMusic(){

if(!audioContext){

audioContext=
new(
window.AudioContext||
window.webkitAudioContext
)();

}

if(audioContext.state==="suspended"){

audioContext.resume();

}

const C=261.63;
const D=293.66;
const E=329.63;
const F=349.23;
const G=392.00;
const A=440.00;
const Bb=466.16;

const melody=[

[C,.35],
[C,.35],
[D,.70],
[C,.70],
[F,.70],
[E,1.00],

[C,.35],
[C,.35],
[D,.70],
[C,.70],
[G,.70],
[F,1.00],

[C,.35],
[C,.35],
[C,.70],
[A,.70],
[F,.70],
[E,.70],
[D,1.00],

[Bb,.35],
[Bb,.35],
[A,.70],
[F,.70],
[G,.70],
[F,1.20]

];

let time=
audioContext.currentTime+.1;

melody.forEach(
([note,duration])=>{

playNote(
note,
duration*.9,
time
);

time+=duration;

}
);

musicTimer=
setTimeout(()=>{

if(musicPlaying){

startMusic();

}

},(time-audioContext.currentTime)*1000);

}

musicBtn.addEventListener(
"click",
()=>{

if(!musicPlaying){

musicPlaying=true;

musicBtn.innerHTML=
"🔊 Music চলছে...";

startMusic();

}else{

musicPlaying=false;

musicBtn.innerHTML=
"🎵 Birthday Music";

if(musicTimer){

clearTimeout(musicTimer);

}

if(audioContext){

audioContext.close();

audioContext=null;

}

}

});

</script>

</body>
  </html>
